[project]
name = "langgraph-api"
version = "0.0.33"
description = ""
authors = [
    { name = "Nuno Campos", email = "nuno@langchain.dev" },
    { name = "Will Fu-Hinthorn", email = "will@langchain.dev" },
]
license = "Elastic-2.0"
readme = "README.md"
requires-python = ">=3.11.0,<4.0"
dependencies = [
    "sse-starlette>=2.1.3,<3.4.0",
    "starlette>=0.38.6",
    "watchfiles>=0.13",
    "langgraph>=1.1.0,<2",
    "langgraph-checkpoint>=4.0.0,<5",
    "orjson>=3.9.7",
    "uvicorn>=0.26.0",
    "langsmith>=0.7.0,<1",
    "httpx>=0.25.0",
    "langchain-core>=1.0.0,<2",
    "tenacity>=8.0.0",
    "jsonschema-rs>=0.20.0,<0.30",
    "structlog>=24.1.0,<26",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.3",
    "langgraph-sdk>=0.3.0",
]

[project.scripts]
langgraph-verify-graphs = "langgraph_api.graph:verify_graphs"

[dependency-groups]
dev = [
    "ruff>=0.6.2,<1",
    "codespell>=2.2.0,<3",
    "pytest>=7.4.4,<8",
    "anyio>=4.4.0,<5",
    "pytest-watcher>=0.4.2,<1",
    "langgraph-cli>=0.4.0,<0.5",
    "pytest-repeat>=0.9.3,<1",
    "pytest-retry>=1.6.3,<2",
    "pytest-httpserver>=1.1.0,<2",
    "fastapi>=0.115.8,<1",
    "langgraph>=1.1.0",
    "pycryptodome>=3.22.0,<4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["langgraph_api", "langgraph_storage", "langgraph_license"]
data-includes = ["LICENSE", "openapi.json", "logging.json"]

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
addopts = "--strict-markers --strict-config --durations=5 -vv"

[tool.ruff]
lint.select = ["E", "F", "UP", "B", "I"]
lint.ignore = ["E501", "B008"]
target-version = "py311"

[tool.pytest-watcher]
now = true
delay = 3
patterns = ["*.py"]
